  <line x1="232" y1="235" x2="160" y2="190" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="235" x2="352" y2="190" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="238" y1="270" x2="175" y2="330" stroke="#111111" stroke-width="10" stroke-linecap="round"/>
  <line x1="274" y1="270" x2="337" y2="330" stroke="#111111" stroke-width="10" stroke-linecap="round"/>

