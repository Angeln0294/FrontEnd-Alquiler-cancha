  <!-- Pentágonos exteriores -->
  <polygon points="256,80 220,130 256,140 292,130" fill="#111111"/>
  <polygon points="120,165 160,190 200,150 160,120" fill="#111111"/>
  <polygon points="392,165 352,120 312,150 352,190" fill="#111111"/>
